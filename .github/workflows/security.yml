name: security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
permissions:
  contents: read
jobs:
  scanners:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./...
      - run: go install github.com/securego/gosec/v2/cmd/gosec@latest && gosec -quiet -severity high ./...
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: google/osv-scanner-action/osv-scanner-action@v2
        with: { scan-args: "--recursive ./" }
      - name: Security score gate
        run: make score-check

  codeql:
    runs-on: ubuntu-latest
    permissions: { security-events: write, contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: { languages: "go,javascript" }
      - uses: github/codeql-action/analyze@v3

  scorecard:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { security-events: write, id-token: write, contents: read }
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: ossf/scorecard-action@v2
        with: { results_file: scorecard.sarif, results_format: sarif, publish_results: true }
      - uses: github/codeql-action/upload-sarif@v3
        with: { sarif_file: scorecard.sarif }

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anchore/sbom-action@v0
        with: { format: cyclonedx-json }
