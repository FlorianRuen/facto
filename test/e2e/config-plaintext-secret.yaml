name: config-plaintext-secret
description: >
  Security negative. A password pasted in plaintext in config.yaml (instead
  of a bw:// or keyring:// reference) is a configuration error (exit 2) that
  names the key but never echoes the value: the canary must not appear on
  stdout, stderr or in any file facto writes. Nothing is created.
setup:
  - path: config.yaml
    content: |
      output:
        local: ~/Invoices
      state_dir: ~/.facto
      notify: none
      connectors:
        edf: { enabled: false, category: housing, password: "{{canary:password}}" }
args: [collect, --config, "{{home}}/config.yaml", --year, "2026", --non-interactive]
expect:
  exit: 2
  stdout:
    empty: true
  stderr:
    contains: ["configuration error", "connectors.edf.password"]
  absent:
    - Invoices
    - .facto
