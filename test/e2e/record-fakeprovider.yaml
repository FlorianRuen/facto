name: record-fakeprovider
description: >
  J2. facto record drives the hardened browser (pipe, no CDP port,
  disposable profile removed after the run, in-browser allowlist) on the
  fake site in record mode: the login page fills the canary credentials and
  submits itself (facto automates nothing), the account page loads the
  invoice list with a bearer token minted like a session, then one PDF.
  The login page also posts the credentials as multipart/form-data
  (SEC-J2-2): redacted part by part; and as JSON under the urlencoded
  content type, as jQuery sends it (SEC-J2-6).
  The written HAR is 0600, keeps the flow (login POST, redirect, list, PDF,
  cookie names) and holds no password, login, cookie value, bearer token,
  CSRF value or PDF byte: every canary and every value the site minted is
  absent from it, from stdout, stderr and every file under HOME. The
  off-allowlist evil.test requests of the login page are blocked.
setup:
  - path: rec
    dir: true
# The account page is an app shell whose bundle lives on shared storage
# (J2, Wecasa): only --allow-static lets the list load.
args: [record, "https://www.fakeprovider.test/login", --connector, fakeprovider, --allow-static, "https://static.fakeprovider.test/app/", --out, "{{home}}/rec/fakeprovider.har", --until, "#done", --timeout, 90s]
fakesite:
  mode: record
  login: fp/login
  password: fp/password
  invoices:
    - { id: FP-2026-0001, contract: C-1, issued_at: 2026-03-14, amount_cents: 8412, currency: EUR, fixture: edf-invoice.pdf }
secrets:
  fp/login: "user-{{canary:token}}"
  fp/password: "{{canary:password}}"
# FACTO_E2E_INTERACTIVE=1 with an open, empty stdin: no Enter is ever
# pressed, the recording stops on #done.
interactive: true
expect:
  exit: 0
  stdout:
    contains: ["record: wrote", "entries, redacted", "keep it private"]
  stderr:
    contains: ["stopping (selector visible)"]
  files:
    - path: rec/fakeprovider.har
      mode: "0600"
      contains:
        - '"creator": {'
        - "https://www.fakeprovider.test/login"
        - '"method": "POST"'
        - "password=%5Bredacted%5D"
        - "username=%5Bredacted%5D"
        # SEC-J2-2: the multipart/form-data copy of the credentials is
        # redacted part by part.
        - "multipart/form-data; boundary="
        - 'name=\"password\"\r\n\r\n[redacted]'
        - 'name=\"username\"\r\n\r\n[redacted]'
        # SEC-J2-6: JSON under the urlencoded content type is redacted too.
        - '{\"password\":\"[redacted]\",\"username\":\"[redacted]\"}'
        - "/api/invoices?from=2000-01-01"
        - "/api/invoices/FP-2026-0001/pdf"
        - '\"id\":\"FP-2026-0001\"'
        - '"name": "fp_session"'
        - '"name": "authorization"'
        # The bearer token the account page inlines is scrubbed (taint).
        - 'token: \"[redacted]\"'
        - "https://static.fakeprovider.test/app/list.js"
        - "binary body not recorded"
        - "ERR_BLOCKED_BY_CLIENT"
      not_contains:
        - "%PDF"
        - "csrf_token=Z"
  requests:
    - { method: POST, host: www.fakeprovider.test, path: /login, count: 1 }
    - { method: POST, host: www.fakeprovider.test, path: /login/check, count: 1 }
    - { method: POST, host: www.fakeprovider.test, path: /login/check-json, count: 1 }
    - { host: www.fakeprovider.test, path: /api/invoices, min: 1 }
    - { host: evil.test, count: 0 }
    # Static allowlist: the app bundle only, never another bucket.
    - { host: static.fakeprovider.test, path: /app/list.js, min: 1 }
    - { host: static.fakeprovider.test, path: /other-bucket/evil.js, count: 0 }
  browser:
    no_cdp_port: true
    profile_removed: true
