name: fakeprovider-password
description: >
  J1 T23. collect logs in to the fake site in password mode (CSRF form) with
  e2e:// references, in a headless Chrome with no TCP debugging port and a
  disposable profile removed after the run; it files the two 2026 invoices
  (0600 in 0700 dirs, report state ok) and seals the session. The password,
  the login, the session cookie and every value the site minted are absent
  from stdout, stderr and every file under HOME. The off-allowlist evil.test
  pixel of the login page is never requested. Run 2 restores the sealed
  session: no browser, no login POST, no PDF fetched again, nothing changed
  under Invoices. All values are synthetic (testsecrets canaries).
setup:
  - path: config.yaml
    content: |
      output:
        local: ~/Invoices
      state_dir: ~/.facto
      notify: none
      sessions: persistent
      connectors:
        fakeprovider:
          enabled: true
          category: services
          login: e2e://fp/login
          password: e2e://fp/password
args: [collect, --config, "{{home}}/config.yaml", --year, "2026", --non-interactive]
fakesite:
  mode: password
  login: fp/login
  password: fp/password
  invoices:
    - { id: FP-2026-0001, contract: C-1, issued_at: 2026-03-14, amount_cents: 8412, currency: EUR, fixture: edf-invoice.pdf }
    - { id: FP-2026-0002, contract: C-1, issued_at: 2026-06-30, fixture: unknown-scan.pdf }
    # Outside --year 2026: never listed for the run, never fetched.
    - { id: FP-2025-0099, contract: C-1, issued_at: 2025-12-31, amount_cents: 100, currency: EUR, fixture: impots-notice.pdf }
secrets:
  fp/login: "user-{{canary:token}}"
  fp/password: "{{canary:password}}"
expect:
  exit: 0
  stdout:
    contains:
      - "- ok fakeprovider"
      - "summary: filed 2"
      - "- filed fakeprovider FP-2026-0001 -> 2026/services/fakeprovider/2026-03-14_fakeprovider_invoice_84-12EUR_fp-2026-0001.pdf"
      - "- filed fakeprovider FP-2026-0002 -> 2026/services/fakeprovider/2026-06-30_fakeprovider_invoice_fp-2026-0002.pdf"
    not_contains: [FP-2025-0099]
  stderr:
    not_contains:
      # Persistent sessions must persist in the e2e build (its own key
      # source, never the developer's keyring: the sandbox has no bus).
      - "keyring unavailable"
      - "sessions are ephemeral"
  files:
    - path: Invoices/2026/services/fakeprovider/2026-03-14_fakeprovider_invoice_84-12EUR_fp-2026-0001.pdf
      mode: "0600"
      fixture: edf-invoice.pdf
    - path: Invoices/2026/services/fakeprovider/2026-06-30_fakeprovider_invoice_fp-2026-0002.pdf
      mode: "0600"
      fixture: unknown-scan.pdf
    - path: .facto/sessions/fakeprovider.sess
      mode: "0600"
    - path: .facto/index.db
      mode: "0600"
  absent:
    # Chrome state outside the disposable profile survives the run (crash
    # reports may hold page memory: typed credentials): none may be created.
    - .config/google-chrome-for-testing
  trees:
    - path: Invoices
      private: true
      entries:
        - 2026/
        - 2026/services/
        - 2026/services/fakeprovider/
        - 2026/services/fakeprovider/2026-03-14_fakeprovider_invoice_84-12EUR_fp-2026-0001.pdf
        - 2026/services/fakeprovider/2026-06-30_fakeprovider_invoice_fp-2026-0002.pdf
        - inbox/
    - path: .facto
      private: true
    # The disposable Chrome profile lived here (no XDG_RUNTIME_DIR): gone.
    - path: .facto/tmp
      private: true
      entries: []
  requests:
    - { method: GET, host: www.fakeprovider.test, path: /login, count: 1 }
    - { method: POST, host: www.fakeprovider.test, path: /login, count: 1 }
    - { method: POST, path: /login*, count: 1 }
    - { method: GET, host: www.fakeprovider.test, path: /account, count: 1 }
    - { host: sso.fakeprovider.test, count: 0 }
    - { host: evil.test, count: 0 }
    - { method: GET, host: www.fakeprovider.test, path: /api/invoices, min: 1 }
    - { method: GET, host: www.fakeprovider.test, path: /api/invoices/FP-2026-0001/pdf, count: 1 }
    - { method: GET, host: www.fakeprovider.test, path: /api/invoices/FP-2026-0002/pdf, count: 1 }
    - { path: /api/invoices/FP-2025-0099/pdf, count: 0 }
    - { status: 401, count: 0 }
    - { status: 403, count: 0 }
  browser: { no_cdp_port: true, profile_removed: true }
repeat:
  expect:
    exit: 0
    stdout:
      contains:
        - "- ok fakeprovider"
        - "summary: skipped-known-id 2"
        - "- skipped-known-id fakeprovider FP-2026-0001"
        - "- skipped-known-id fakeprovider FP-2026-0002"
      not_contains: ["- filed ", FP-2025-0099]
    stderr:
      not_contains: ["keyring unavailable", "sessions are ephemeral"]
    files:
      - path: .facto/sessions/fakeprovider.sess
        mode: "0600"
    trees:
      - path: .facto
        private: true
      - path: .facto/tmp
        private: true
        entries: []
    requests:
      # Session restored from the sealed file: no browser, no login.
      - { path: /login*, count: 0 }
      - { path: /account, count: 0 }
      - { host: sso.fakeprovider.test, count: 0 }
      - { host: evil.test, count: 0 }
      - { method: GET, host: www.fakeprovider.test, path: /api/*, min: 1 }
      - { path: "/api/invoices/*", count: 0 }
      - { status: 401, count: 0 }
  unchanged: [Invoices]
