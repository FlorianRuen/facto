name: fakeprovider-bad-password
description: >
  J1 T24. The site refuses the credentials (#login-error on the same form).
  The connector is auth_failed after one submit (no retry), and the report
  tells the user to fix the credentials with `facto config fakeprovider`
  (spec, state table), not `facto login`. No session is sealed, no API
  request, exit 1. All values are synthetic.
setup:
  - path: config.yaml
    content: |
      output:
        local: ~/Invoices
      state_dir: ~/.facto
      notify: none
      sessions: persistent
      connectors:
        fakeprovider:
          enabled: true
          category: services
          login: e2e://fp/login
          password: e2e://fp/password
args: [collect, --config, "{{home}}/config.yaml", --year, "2026", --non-interactive]
fakesite:
  mode: bad-password
  login: fp/login
  password: fp/password
  invoices:
    - { id: FP-2026-0001, contract: C-1, issued_at: 2026-03-14, amount_cents: 8412, currency: EUR, fixture: edf-invoice.pdf }
secrets:
  fp/login: "user-{{canary:token}}"
  fp/password: "{{canary:password}}"
expect:
  exit: 1
  stdout:
    contains:
      - "- auth_failed fakeprovider"
      - "facto config fakeprovider"
    not_contains: ["- ok fakeprovider", "- filed ", "facto login fakeprovider"]
  absent:
    - .facto/sessions/fakeprovider.sess
    - Invoices/2026
    - .config/google-chrome-for-testing
  trees:
    - path: .facto
      private: true
    - path: .facto/tmp
      private: true
      entries: []
  requests:
    - { method: GET, host: www.fakeprovider.test, path: /login, count: 1 }
    # One submit, answered with the form again (200 + #login-error): no retry.
    - { method: POST, host: www.fakeprovider.test, path: /login, status: 200, count: 1 }
    - { method: POST, count: 1 }
    - { path: /account, count: 0 }
    - { path: /api/*, count: 0 }
    - { host: sso.fakeprovider.test, count: 0 }
    - { host: evil.test, count: 0 }
  browser: { no_cdp_port: true, profile_removed: true }
