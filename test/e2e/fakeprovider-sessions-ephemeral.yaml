name: fakeprovider-sessions-ephemeral
description: >
  J1 T24, A13. sessions: ephemeral. A session file left by an earlier
  persistent setup is planted before run 1, mode 0000 so that any open of
  it fails: facto deletes it at startup without reading it (no permission
  error, no restore attempt), writes nothing under sessions/, and logs in
  through the browser on every run (run 2 included: one POST /login each).
  Run 2 files nothing new (the index still dedups). All values are
  synthetic.
setup:
  - path: config.yaml
    content: |
      output:
        local: ~/Invoices
      state_dir: ~/.facto
      notify: none
      sessions: ephemeral
      connectors:
        fakeprovider:
          enabled: true
          category: services
          login: e2e://fp/login
          password: e2e://fp/password
  - path: .facto/sessions/fakeprovider.sess
    mode: "0000"
    content: "planted, never a sealed session {{canary:session}}\n"
args: [collect, --config, "{{home}}/config.yaml", --year, "2026", --non-interactive]
fakesite:
  mode: password
  login: fp/login
  password: fp/password
  invoices:
    - { id: FP-2026-0001, contract: C-1, issued_at: 2026-03-14, amount_cents: 8412, currency: EUR, fixture: edf-invoice.pdf }
secrets:
  fp/login: "user-{{canary:token}}"
  fp/password: "{{canary:password}}"
expect:
  exit: 0
  stdout:
    contains:
      - "- ok fakeprovider"
      - "summary: filed 1"
  stderr:
    not_contains:
      - "permission denied"
      - "saved session not restored"
      - "remove_failed=1"
  absent:
    - .facto/sessions/fakeprovider.sess
    - .config/google-chrome-for-testing
  trees:
    - path: .facto/sessions
      private: true
      entries: []
    - path: .facto
      private: true
    - path: .facto/tmp
      private: true
      entries: []
  requests:
    # No restore: no probe before the browser login.
    - { path: /api/me, count: 0 }
    - { method: POST, host: www.fakeprovider.test, path: /login, count: 1 }
    - { method: GET, host: www.fakeprovider.test, path: /account, count: 1 }
    - { method: GET, host: www.fakeprovider.test, path: /api/invoices/FP-2026-0001/pdf, count: 1 }
    - { host: evil.test, count: 0 }
  browser: { no_cdp_port: true, profile_removed: true }
repeat:
  expect:
    exit: 0
    stdout:
      contains:
        - "- ok fakeprovider"
        - "summary: skipped-known-id 1"
      not_contains: ["- filed "]
    stderr:
      not_contains: ["permission denied", "saved session not restored"]
    absent:
      - .facto/sessions/fakeprovider.sess
    trees:
      - path: .facto/sessions
        private: true
        entries: []
      - path: .facto/tmp
        private: true
        entries: []
    requests:
      # Nothing was kept: the browser logs in again.
      - { path: /api/me, count: 0 }
      - { method: POST, host: www.fakeprovider.test, path: /login, count: 1 }
      - { method: GET, host: www.fakeprovider.test, path: /account, count: 1 }
      - { path: "/api/invoices/*", count: 0 }
      - { host: evil.test, count: 0 }
    browser: { no_cdp_port: true, profile_removed: true }
  unchanged: [Invoices]
