name: inbox
description: >
  J0 T28. Manual drops in <output.local>/inbox are identified (Factur-X >
  compliant name > subfolder + dated name), filed under
  {year}/{category}/{provider}/ with the default templates, and removed from
  the inbox; an identical duplicate is skipped and removed; an unidentifiable
  file stays with a warning. Everything written is 0600/0700, and a second run
  changes nothing and still exits 0. All fixtures are synthetic
  (test/e2e/testdata, generated by TestFixtures_SyntheticPDFs).
setup:
  - path: config.yaml
    mode: "0600"
    content: |
      output:
        local: ~/Invoices
      state_dir: ~/.facto
      notify: none
      manual:
        - { id: edf, name: "EDF", category: housing }
        - { id: impots, name: "Impots", category: housing }
        - { id: fournisseur-exemple-sas, name: "Fournisseur Exemple", category: services }
  # (a) compliant name: provider, date, amount and ref come from the name.
  - path: Invoices/inbox/2026-03-14_edf_invoice_84-12EUR_10234567.pdf
    fixture: edf-invoice.pdf
  # (b) Factur-X: a meaningless name; everything comes from the embedded XML
  # (seller "Fournisseur Exemple SAS", FA-2026-0001, 2026-03-14, 84.12 EUR).
  - path: Invoices/inbox/scan-fournisseur.pdf
    fixture: facturx-invoice.pdf
  # (c) provider subfolder + single ISO date in the name. Dropped 0644 on
  # purpose: the filed copy must still be 0600.
  - path: Invoices/inbox/impots/avis-2026-10-02.pdf
    mode: "0644"
    fixture: impots-notice.pdf
  # (d) byte-identical copy of (a) under another identified name: same
  # SHA-256, so skipped (dedup rule 2) and removed from the inbox.
  - path: Invoices/inbox/edf/copie-2026-03-14.pdf
    fixture: edf-invoice.pdf
  # (e) no Factur-X, not compliant, no subfolder, no date: stays.
  - path: Invoices/inbox/document-scanne.pdf
    fixture: unknown-scan.pdf
args: [collect, --config, "{{home}}/config.yaml", --year, "2026", --non-interactive]
expect:
  exit: 0
  stdout:
    contains:
      - "summary: filed 3, skipped-duplicate 1"
      - "warnings: 1"
      - "- filed inbox 2026-03-14_edf_invoice_84-12EUR_10234567.pdf -> 2026/housing/edf/2026-03-14_edf_invoice_84-12EUR_10234567.pdf"
      - "- filed inbox scan-fournisseur.pdf -> 2026/services/fournisseur-exemple-sas/2026-03-14_fournisseur-exemple-sas_invoice_84-12EUR_fa-2026-0001.pdf"
      - "- filed inbox impots/avis-2026-10-02.pdf -> 2026/housing/impots/2026-10-02_impots_invoice.pdf"
      - "- skipped-duplicate inbox edf/copie-2026-03-14.pdf"
      - "- unidentified inbox document-scanne.pdf"
  files:
    - path: Invoices/2026/housing/edf/2026-03-14_edf_invoice_84-12EUR_10234567.pdf
      mode: "0600"
      fixture: edf-invoice.pdf
    - path: Invoices/2026/services/fournisseur-exemple-sas/2026-03-14_fournisseur-exemple-sas_invoice_84-12EUR_fa-2026-0001.pdf
      mode: "0600"
      fixture: facturx-invoice.pdf
    - path: Invoices/2026/housing/impots/2026-10-02_impots_invoice.pdf
      mode: "0600"
      fixture: impots-notice.pdf
    - path: Invoices/inbox/document-scanne.pdf
      mode: "0600"
      fixture: unknown-scan.pdf
    - path: .facto/index.db
      mode: "0600"
  trees:
    # Exactly the filed documents plus what stays in the inbox: no temp file,
    # no second copy of the duplicate, no index or report in the output.
    - path: Invoices
      private: true
      entries:
        - 2026/
        - 2026/housing/
        - 2026/housing/edf/
        - 2026/housing/edf/2026-03-14_edf_invoice_84-12EUR_10234567.pdf
        - 2026/housing/impots/
        - 2026/housing/impots/2026-10-02_impots_invoice.pdf
        - 2026/services/
        - 2026/services/fournisseur-exemple-sas/
        - 2026/services/fournisseur-exemple-sas/2026-03-14_fournisseur-exemple-sas_invoice_84-12EUR_fa-2026-0001.pdf
        - inbox/
        - inbox/document-scanne.pdf
        - inbox/edf/
        - inbox/impots/
    - path: .facto
      private: true
    - path: .facto/reports
      private: true
repeat:
  expect:
    exit: 0
    stdout:
      contains:
        - "summary: no documents"
        - "warnings: 1"
        - "- unidentified inbox document-scanne.pdf"
      not_contains:
        - "- filed "
        - "- skipped-duplicate "
    trees:
      - path: .facto
        private: true
  unchanged: [Invoices]
