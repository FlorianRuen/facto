name: fakeprovider-expired-session
description: >
  J1 T24. Run 1 logs in (password form) and seals the session. Between the
  runs the site expires it: it serves 4 authenticated API requests per
  session (run 1 used 3: the list and two PDFs), so run 2 restores the
  sealed session, its probe (/api/me, request 4) is still accepted and the
  list (request 5) answers 401. The restored session was refused: the
  connector is needs_login (spec "Run lifecycle" 3 and the note under the
  state table), the report tells the user to run `facto login fakeprovider`,
  the sealed session is dropped (no .sess afterwards) and, the run being
  non-interactive, no login is attempted (zero request to /login*), no PDF
  is fetched, exit 1, Invoices unchanged. All values are synthetic.
setup:
  - path: config.yaml
    content: |
      output:
        local: ~/Invoices
      state_dir: ~/.facto
      notify: none
      sessions: persistent
      connectors:
        fakeprovider:
          enabled: true
          category: services
          login: e2e://fp/login
          password: e2e://fp/password
args: [collect, --config, "{{home}}/config.yaml", --year, "2026", --non-interactive]
fakesite:
  mode: expired-session
  login: fp/login
  password: fp/password
  expire_after: 4
  invoices:
    - { id: FP-2026-0001, contract: C-1, issued_at: 2026-03-14, amount_cents: 8412, currency: EUR, fixture: edf-invoice.pdf }
    - { id: FP-2026-0002, contract: C-1, issued_at: 2026-06-30, fixture: unknown-scan.pdf }
secrets:
  fp/login: "user-{{canary:token}}"
  fp/password: "{{canary:password}}"
expect:
  exit: 0
  stdout:
    contains:
      - "- ok fakeprovider"
      - "summary: filed 2"
    not_contains: [needs_login]
  stderr:
    not_contains: ["keyring unavailable", "sessions are ephemeral"]
  files:
    - path: Invoices/2026/services/fakeprovider/2026-03-14_fakeprovider_invoice_84-12EUR_fp-2026-0001.pdf
      mode: "0600"
      fixture: edf-invoice.pdf
    - path: Invoices/2026/services/fakeprovider/2026-06-30_fakeprovider_invoice_fp-2026-0002.pdf
      mode: "0600"
      fixture: unknown-scan.pdf
    - path: .facto/sessions/fakeprovider.sess
      mode: "0600"
  absent:
    - .config/google-chrome-for-testing
  trees:
    - path: Invoices
      private: true
    - path: .facto
      private: true
    - path: .facto/tmp
      private: true
      entries: []
  requests:
    - { method: POST, host: www.fakeprovider.test, path: /login, count: 1 }
    - { method: GET, host: www.fakeprovider.test, path: /account, count: 1 }
    # expire_after rests on these exact counts: 3 API requests in run 1.
    - { path: /api/me, count: 0 }
    - { method: GET, host: www.fakeprovider.test, path: /api/invoices, count: 1 }
    - { method: GET, host: www.fakeprovider.test, path: /api/invoices/FP-2026-0001/pdf, count: 1 }
    - { method: GET, host: www.fakeprovider.test, path: /api/invoices/FP-2026-0002/pdf, count: 1 }
    - { path: /api/*, count: 3 }
    - { status: 401, count: 0 }
    - { host: evil.test, count: 0 }
  browser: { no_cdp_port: true, profile_removed: true }
repeat:
  expect:
    exit: 1
    stdout:
      contains:
        - "- needs_login fakeprovider"
        - "note: login required: run `facto login fakeprovider`"
      not_contains: ["- ok fakeprovider", "- filed "]
    stderr:
      not_contains: ["keyring unavailable", "sessions are ephemeral"]
    absent:
      # The refused session is dropped, never retried on the next run.
      - .facto/sessions/fakeprovider.sess
    trees:
      - path: .facto
        private: true
      - path: .facto/tmp
        private: true
        entries: []
    requests:
      # Session restored (no browser), probe accepted, list refused.
      - { method: GET, host: www.fakeprovider.test, path: /api/me, status: 200, count: 1 }
      - { method: GET, host: www.fakeprovider.test, path: /api/invoices, status: 401, count: 1 }
      - { status: 401, last: true }
      # Non-interactive: no login attempt, nothing after the 401.
      - { path: /login*, count: 0 }
      - { path: /account, count: 0 }
      - { path: "/api/invoices/*", count: 0 }
      - { count: 2 }
      - { host: sso.fakeprovider.test, count: 0 }
      - { host: evil.test, count: 0 }
  unchanged: [Invoices]
