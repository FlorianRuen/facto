name: fakeprovider-captcha
description: >
  J1 T24. The site answers the login URL with a captcha page. The run is
  non-interactive: the captcha is never automated (no typing, no click,
  zero submit of any form, the captcha included), no visible browser is
  opened, the connector is needs_login and the report tells the user to run
  `facto login fakeprovider` (A6). No API request, no session sealed,
  exit 1. All values are synthetic.
setup:
  - path: config.yaml
    content: |
      output:
        local: ~/Invoices
      state_dir: ~/.facto
      notify: none
      sessions: persistent
      connectors:
        fakeprovider:
          enabled: true
          category: services
          login: e2e://fp/login
          password: e2e://fp/password
args: [collect, --config, "{{home}}/config.yaml", --year, "2026", --non-interactive]
fakesite:
  mode: captcha
  login: fp/login
  password: fp/password
  invoices:
    - { id: FP-2026-0001, contract: C-1, issued_at: 2026-03-14, amount_cents: 8412, currency: EUR, fixture: edf-invoice.pdf }
secrets:
  fp/login: "user-{{canary:token}}"
  fp/password: "{{canary:password}}"
expect:
  exit: 1
  stdout:
    contains:
      - "- needs_login fakeprovider"
      - "note: login required: run `facto login fakeprovider`"
    not_contains: ["- ok fakeprovider", "- filed "]
  absent:
    - .facto/sessions/fakeprovider.sess
    - Invoices/2026
    - .config/google-chrome-for-testing
  trees:
    - path: .facto
      private: true
    - path: .facto/tmp
      private: true
      entries: []
  requests:
    - { method: GET, host: www.fakeprovider.test, path: /login, status: 302, count: 1 }
    # Headless only: one captcha page load, no visible relaunch.
    - { method: GET, host: www.fakeprovider.test, path: /login/captcha, count: 1 }
    - { method: POST, path: /login/captcha, count: 0 }
    - { method: POST, count: 0 }
    - { path: /account, count: 0 }
    - { path: /api/*, count: 0 }
    - { host: sso.fakeprovider.test, count: 0 }
    - { host: evil.test, count: 0 }
  browser: { no_cdp_port: true, profile_removed: true }
