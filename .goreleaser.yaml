# Release build for facto (ADR 0001, ADR 0004: pure Go, CGO off).
# Checked locally with `make release-check` (pinned goreleaser image).
version: 2

project_name: facto

before:
  hooks:
    - go mod verify

builds:
  - id: facto
    main: ./cmd/facto
    binary: facto
    env:
      - CGO_ENABLED=0
    # No windows until the browser runs in a Job object: release gate of
    # ADR 0008, issue #3 (SEC-J1-11). make release-e2e-check refuses it.
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    # Reproducible: no local paths, no build ID, timestamps from the commit.
    flags:
      - -trimpath
    ldflags:
      - -s -w -buildid= -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: facto
    ids: [facto]
    formats: [tar.gz]
    # Kept for when the ADR 0008 Windows gate (issue #3) is lifted.
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE*
      - README.md
      - docs/security.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

# One SPDX SBOM per archive, produced by syft (installed by release.yml).
sboms:
  - artifacts: archive

# Keyless cosign signature of the checksum file, which covers every archive
# and SBOM; the workflow grants id-token: write for this.
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
      - --yes

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: git
  sort: asc
